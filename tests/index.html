<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes — Calculadora Trader</title>
<style>
  :root{--ok:#1E7A4C;--bad:#AA372B;--ink:#1C2B22;--bg:#F2F5EF}
  @media (prefers-color-scheme: dark){:root{--ok:#68D19C;--bad:#F0968A;--ink:#E6ECE2;--bg:#12160F}}
  body{font:14px Consolas,monospace;background:var(--bg);color:var(--ink);margin:0;padding:24px 16px}
  .ok{color:var(--ok)} .bad{color:var(--bad);font-weight:bold} h1{font:700 20px Georgia,serif}
  pre{white-space:pre-wrap}
</style>
<script src="../js/util.js"></script>
<script src="../js/state.js"></script>
<script src="../js/fiscal.js"></script>
<script src="../js/pdf-parser.js"></script>
<script src="../js/performance.js"></script>
<script src="../js/cash.js"></script>
</head>
<body>
<h1>Testes das regras fiscais</h1>
<div id="summary"></div>
<pre id="out"></pre>
<script>
'use strict';
var results=[];
function test(name,fn){
  try{fn();results.push({name:name,ok:true})}
  catch(e){results.push({name:name,ok:false,err:e.message})}
}
function eq(a,b,msg){
  var ja=JSON.stringify(a),jb=JSON.stringify(b);
  if(ja!==jb)throw new Error((msg||'')+' esperado '+jb+', obtido '+ja);
}
var seq=0;
function E(date,result,irrf,cat,pid){return{id:'t'+(seq++),personId:pid||'p1',date:date,cat:cat||'futuros',result:result,irrf:irrf||0}}
function L(entries){st=stateDefault();st.active='p1';return ledger(entries,{},'p1')}
function pick(r){return{ym:r.ym,result:r.result,usedLoss:r.usedLoss,base:r.base,tax:r.tax,creditUsed:r.creditUsed,darf:r.darf,loss:r.loss,credit:r.credit}}

// ---------- Apuração ----------
test('lucro simples: 20% menos IRRF',function(){
  var r=L([E('2026-03-10',600,3),E('2026-03-11',400,2)]);
  eq(pick(r[0]),{ym:'2026-03',result:1000,usedLoss:0,base:1000,tax:200,creditUsed:5,darf:195,loss:0,credit:0});
});
test('prejuízo compensa meses seguintes',function(){
  var r=L([E('2026-01-05',-300),E('2026-02-05',1000,10)]);
  eq(pick(r[0]).loss,300);
  eq(pick(r[1]),{ym:'2026-02',result:1000,usedLoss:300,base:700,tax:140,creditUsed:10,darf:130,loss:0,credit:0});
});
test('prejuízo maior que o lucro continua acumulado',function(){
  var r=L([E('2026-01-05',-500),E('2026-02-05',200)]);
  eq([r[1].usedLoss,r[1].base,r[1].darf,r[1].loss],[200,0,0,300]);
});
test('ações e futuros de day trade se compensam entre si',function(){
  var r=L([E('2026-04-01',-100,0,'acoes'),E('2026-04-02',600,0,'futuros')]);
  eq([r[0].result,r[0].acoes,r[0].futuros,r[0].tax],[500,-100,600,100]);
});
test('DARF abaixo de R$ 10 é acumulado para o mês seguinte',function(){
  var r=L([E('2026-05-02',40),E('2026-06-02',30)]);
  eq([r[0].darf,r[0].below],[0,true],'mai');
  eq([r[1].tax,r[1].darf,r[1].below],[6,14,false],'jun');
});
test('IRRF maior que o imposto vira crédito no mesmo ano',function(){
  var r=L([E('2026-07-01',10,5),E('2026-08-01',100,0)]);
  eq([r[0].tax,r[0].creditUsed,r[0].credit],[2,2,3],'jul');
  eq([r[1].tax,r[1].creditUsed,r[1].darf,r[1].credit],[20,3,17,0],'ago');
});
test('crédito de IRRF é zerado na virada do ano',function(){
  var r=L([E('2025-12-01',-50,4),E('2026-01-10',100,0)]);
  eq(r[0].credit,4);
  eq([r[1].usedLoss,r[1].base,r[1].tax,r[1].creditUsed,r[1].darf],[50,50,10,0,10]);
});
test('arredondamento em centavos',function(){
  var r=L([E('2026-08-18',28.38,0.28),E('2026-08-19',47.94,0.47),E('2026-08-20',50.5,0.5)]);
  eq([r[0].result,r[0].tax,r[0].irrf,r[0].darf],[126.82,25.36,1.25,24.11]);
});

// ---------- Pagamento por CPF ----------
test('pagamento marcado vale só para o CPF',function(){
  st=stateDefault();
  var paid={};paid[paidKey('p1','2026-03')]=true;
  eq(ledger([E('2026-03-01',100)],paid,'p1')[0].paid,true);
  eq(ledger([E('2026-03-01',100,0,'futuros','p2')],paid,'p2')[0].paid,false);
});
test('migração da chave antiga de pagamento (v6.2)',function(){
  var x=normalizeLoadedState({people:[{id:'a'},{id:'b'}],entries:[E('2026-08-01',100,0,'futuros','a')],paid:{'2026-08|daytrade':true}});
  eq(x.paid,{'a|2026-08|daytrade':true});
});

// ---------- Vencimento ----------
test('vencimento: último dia útil do mês seguinte',function(){
  eq(due('2026-08'),'30/09/2026');
  eq(due('2026-09'),'30/10/2026');
});
test('vencimento pula 31/12 e fim de semana',function(){eq(due('2026-11'),'30/12/2026')});
test('vencimento pula Carnaval (fev/2017)',function(){eq(due('2017-01'),'24/02/2017')});
test('vencimento pula Sexta-feira Santa (29/03/2024)',function(){eq(due('2024-02'),'28/03/2024')});

// ---------- Fechamento ----------
test('fechamento: detecta divergência após alteração',function(){
  st=stateDefault();st.active='p1';
  st.closed[closeKey('p1','2026-03')]={result:1000,base:1000,tax:200,irrf:5,darf:195};
  var r=ledger([E('2026-03-10',1000,5)],{},'p1')[0];
  eq(closedDivergence('p1',r),null,'igual');
  r=ledger([E('2026-03-10',1100,5)],{},'p1')[0];
  eq(closedDivergence('p1',r),{closedDarf:195,closedBase:1000},'diferente');
});

// ---------- PDF ----------
test('parseMoney: formato brasileiro',function(){
  eq(parseMoney('1.234,56'),1234.56);eq(parseMoney('-12,50'),-12.5);eq(parseMoney('R$ 0,28'),0.28);
});
test('nota de day trade: resultado = bruto + custos; IRRF separado',function(){
  var r=normalizeDayTradeNote({bruto:35,custos:-6.62,irrf:-0.28,liquidoNota:28.1,warnings:[]});
  eq([r.result,r.irrf,r.tributos,r.warnings.length],[28.38,0.28,-0.28,0]);
});
test('nota com WIN e WDO: Total líquido (#) diferente não gera aviso se o líquido da nota fecha',function(){
  var r=normalizeDayTradeNote({bruto:-287,custos:-8.86,irrf:0,liquidoNota:-295.86,totalLiquidoFiscal:-189.5,warnings:[]});
  eq([r.result,r.warnings.length],[-295.86,0]);
  r=normalizeDayTradeNote({bruto:-287,custos:-8.86,irrf:0,totalLiquidoFiscal:-189.5,warnings:[]});
  eq(r.warnings.length,1,'sem líquido da nota, o (#) ainda confere');
});
test('nota Santander: nome do cliente num único trecho, rótulo dividindo a linha',function(){
  var rows=rebuildRows([
    {x:62,y:727,w:14,s:'Cliente'},{x:428,y:727,w:26,s:'C.N.P.J/C.P.F'},
    {x:127,y:718,w:91,s:'FULANO DE TAL SILVA'},{x:440,y:718,w:35,s:'529.982.247-25'},
    {x:127,y:709,w:78,s:'RUA DAS FLORES, 10'}
  ]);
  eq(nameBelowClientCell(rows),'FULANO DE TAL SILVA');
});
test('comprovante Santander: nome do titular sem os rótulos da mesma linha',function(){
  var lines=['FULANO DE TAL SILVA Data de referência Comprovante','Conta: 123456 07/10/2026 883736'];
  var id=extractIdentity(lines,lines.join('\n'));
  eq([id.name,id.account],['FULANO DE TAL SILVA','123456']);
});
test('nota: custos positivos são tratados como despesa',function(){
  eq(normalizeDayTradeNote({bruto:100,custos:5,irrf:0,warnings:[]}).result,95);
});


// ---------- Desempenho ----------
test('desempenho: acerto, payoff, fator de lucro',function(){
  // 3 pregões: +100 (dois lançamentos no mesmo dia), -50, +20
  var p=computePerformance([E('2026-09-01',60),E('2026-09-01',40),E('2026-09-02',-50),E('2026-09-03',20)]);
  eq([p.days,p.wins,p.losses,p.total],[3,2,1,70]);
  eq([p.avgWin,p.avgLoss,p.payoff,p.profitFactor],[60,-50,1.2,2.4]);
});
test('desempenho: drawdown máximo e sequências',function(){
  var p=computePerformance([E('2026-09-01',100),E('2026-09-02',-30),E('2026-09-03',-50),E('2026-09-04',40),E('2026-09-07',10),E('2026-09-08',0),E('2026-09-09',5)]);
  eq([p.maxDrawdown,p.ddFrom,p.ddTo],[80,'2026-09-01','2026-09-03']);
  eq([p.bestStreak,p.worstStreak],[2,2]);
});
test('desempenho: dia da semana e custos',function(){
  var a=E('2026-09-28',10);a.bruto=12;a.custos=-2;   // segunda
  var b=E('2026-09-29',-5);                          // terça, sem detalhe
  var p=computePerformance([a,b]);
  eq([p.week[0].label,p.week[0].days,p.week[0].total,p.week[1].total],['Seg',1,10,-5]);
  eq([p.bruto,p.custos,p.detailEntries],[12,-2,1]);
});
test('desempenho: sem perdas → payoff e fator indefinidos',function(){
  var p=computePerformance([E('2026-09-01',10)]);
  eq([p.payoff,p.profitFactor,p.maxDrawdown],[null,null,0]);
});

// ---------- Avisos de vencimento ----------
test('aviso de DARF: perto do vencimento, vencido e pago',function(){
  st=stateDefault();
  st.people=[{id:'a',name:'A',cpf:''},{id:'b',name:'B',cpf:''}];
  st.entries=[E('2026-08-10',1000,0,'futuros','a'),E('2026-08-10',500,0,'futuros','b'),E('2026-07-10',300,0,'futuros','b')];
  // venc. de ago/2026 = 30/09/2026; jul/2026 = 31/08/2026
  var al=dueAlerts(new Date(2026,8,25),7);
  eq(al.map(function(x){return x.person.id+' '+x.ym+' '+x.daysLeft}),['b 2026-07 -25','a 2026-08 5','b 2026-08 5']);
  st.paid[paidKey('b','2026-07')]=true;
  eq(dueAlerts(new Date(2026,8,1),7).length,0,'longe do vencimento e jul pago');
});


// ---------- Saldo em conta ----------
function cashState(){
  st=stateDefault();st.active='p1';
  st.people=[{id:'p1',name:'T',cpf:'',accounts:['111']}];
  var n1=E('2026-09-02',100,1);n1.account='Conta 111';n1.liquidoNota=99;   // PDF: líquido da nota
  var n2=E('2026-09-05',-40,0);n2.account='Conta 111';                     // manual: resultado − IRRF
  var n3=E('2026-08-20',500,5);n3.account='Conta 111';n3.liquidoNota=495;   // antes do saldo conferido
  var n4=E('2026-09-10',30,0);n4.account='Conta 222';                      // outra conta
  st.entries=[n1,n2,n3,n4];
  st.cashMoves=[
    {id:'m1',personId:'p1',account:'111',date:'2026-09-01',type:'saldo',amount:1000},
    {id:'m2',personId:'p1',account:'111',date:'2026-09-03',type:'deposito',amount:500},
    {id:'m3',personId:'p1',account:'111',date:'2026-09-06',type:'retirada',amount:200},
    {id:'m4',personId:'p1',account:'111',date:'2026-09-01',type:'deposito',amount:999} // mesmo dia do saldo: já incluso
  ];
}
test('saldo: conferido + notas + depósitos − retiradas',function(){
  cashState();
  var b=accountBalance('p1','111','2026-09-30');
  eq([b.known,b.results,b.notes,b.deposits,b.withdrawals,b.balance],[true,59,2,500,200,1359]);
});
test('saldo: posição em data intermediária',function(){
  cashState();
  eq(accountBalance('p1','111','2026-09-03').balance,1599);
});
test('saldo: novo saldo conferido reinicia a conta',function(){
  cashState();
  st.cashMoves.push({id:'m9',personId:'p1',account:'111',date:'2026-09-05',type:'saldo',amount:1550});
  eq(accountBalance('p1','111','2026-09-30').balance,1350);
});
test('saldo: conta sem saldo conferido nem depósito fica desconhecida',function(){
  cashState();
  var b=accountBalance('p1','222','2026-09-30');
  eq([b.known,b.balance],[false,30]);
  eq(cashAccounts('p1'),['111','222']);
  eq(personCashTotal('p1'),round2(1359+0*30)+0,'soma só contas conhecidas');
});
test('rentabilidade do mês sobre o capital',function(){
  cashState();
  st.cashMoves=st.cashMoves.filter(function(m){return m.id!=='m4'});
  st.cashMoves.push({id:'m0',personId:'p1',account:'111',date:'2026-08-01',type:'saldo',amount:600});
  // capital = saldo em 31/08 (600 + 495) + depósitos de set (500) = 1595; resultado set = 99 − 40 + 30 = 89
  var r=cashReturn('p1','2026-09-01','2026-09-30');
  eq([r.capital,r.result],[1595,89]);
  eq(Math.round(r.pct*10000)/100,5.58);
});
test('rentabilidade: primeiro saldo dentro do período vira capital inicial',function(){
  cashState();
  st.cashMoves=st.cashMoves.filter(function(m){return m.id!=='m4'});
  // ano: conta 111 começa com saldo 1000 em 01/09 → só conta o que veio depois
  var r=cashReturn('p1','2026-01-01','2026-12-31');
  // capital = 1000 + depósito 500; resultado = 99 − 40 (conta 111) + 30 (conta 222, sem saldo) = 89
  eq([r.capital,r.result,r.deposits],[1500,89,500]);
});

test('saldo conferido antes do pregão não inclui a nota do dia',function(){
  cashState();
  st.cashMoves.push({id:'m8',personId:'p1',account:'111',date:'2026-09-05',type:'saldo',amount:1400,before:true});
  // 1400 + nota de 05/09 (−40) − retirada de 06/09 (200)
  eq(accountBalance('p1','111','2026-09-30').balance,1160);
  // no mesmo dia, o saldo de fim do dia vale mais que o de antes do pregão
  st.cashMoves.push({id:'m7',personId:'p1',account:'111',date:'2026-09-05',type:'saldo',amount:1350});
  eq(accountBalance('p1','111','2026-09-30').balance,1150);
});
test('extrato do mês: primeiro saldo conferido no mês vira saldo inicial',function(){
  cashState();
  var s=accountStatement('p1','111','2026-09');
  // parte de 1000 (01/09); n1 = 100 bruto − 1 IRRF; n2 = −40; depósito 500; retirada 200
  eq([s.known,s.opening,s.openingDate,s.bruto,s.custos,s.irrf,s.deposits,s.withdrawals,s.adjust,s.closing],
     [true,1000,'2026-09-01',60,0,-1,500,200,0,1359]);
});
test('extrato do mês: saldo anterior e ajuste quando o extrato diverge',function(){
  cashState();
  st.cashMoves=st.cashMoves.filter(function(m){return m.id!=='m4'});
  st.cashMoves.push({id:'m0',personId:'p1',account:'111',date:'2026-08-01',type:'saldo',amount:600});
  var s=accountStatement('p1','111','2026-09');
  // saldo em 31/08 = 600 + 495 = 1095; conferido 1000 em 01/09 → ajuste −95
  eq([s.opening,s.openingDate,s.bruto,s.irrf,s.deposits,s.withdrawals,s.adjust,s.closing],[1095,'',60,-1,500,200,-95,1359]);
  eq(accountStatement('p1','111','2026-08').closing,1095,'ago fecha no saldo anterior de set');
});
test('extrato do mês: conta sem saldo informado',function(){
  cashState();
  var s=accountStatement('p1','222','2026-09');
  eq([s.known,s.bruto,s.adjust],[false,30,0]);
});

// ---------- Resultado ----------
var fail=results.filter(function(r){return!r.ok});
document.getElementById('summary').innerHTML=fail.length
  ?'<p class="bad">'+fail.length+' de '+results.length+' testes FALHARAM</p>'
  :'<p class="ok">Todos os '+results.length+' testes passaram ✓</p>';
document.getElementById('out').innerHTML=results.map(function(r){
  return r.ok?'<span class="ok">✓</span> '+esc(r.name):'<span class="bad">✗ '+esc(r.name)+' — '+esc(r.err)+'</span>';
}).join('\n');
window.__testResults={total:results.length,failed:fail.map(function(r){return r.name+': '+r.err})};
</script>
</body>
</html>
